# ------------------------------------------------------------
# 1) http://localhost:8083  ->  índice de proyectos
#    (carpeta fuera de www/, así no se exponen los .env)
# ------------------------------------------------------------
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/inicio

    <Directory /var/www/inicio>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# ------------------------------------------------------------
# 2) http://<proyecto>.localhost:8083  ->  www/<proyecto>/public
#    Nuevo proyecto = nueva carpeta; no se edita este archivo.
# ------------------------------------------------------------
<VirtualHost *:80>
    ServerName proyectos.localhost
    ServerAlias *.localhost
    UseCanonicalName Off
    VirtualDocumentRoot /var/www/html/%1/public

    <Directory /var/www/html/*/public>
        Options -Indexes +FollowSymLinks -MultiViews
        # Se ignora el .htaccess de Laravel: su RewriteRule no funciona
        # bien con VirtualDocumentRoot. FallbackResource hace lo mismo.
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        FallbackResource /index.php
        SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>